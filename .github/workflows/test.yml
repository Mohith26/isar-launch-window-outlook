name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs && git diff --exit-code data/andoya.bin data/qmap.json
      - run: node --test test/outlook.test.mjs
